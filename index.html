<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morgan | Link Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            /* 粉紫梦幻渐变背景 */
            background: linear-gradient(135deg, #ffd6ee, #e6c8ff, #d6b8ff);
            background-attachment: fixed;
            padding: 50px 22px;
            position: relative;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* 星光闪烁动画 */
        .sparkle {
            position: absolute;
            color: #ffffff;
            animation: twinkle 2.2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        /* 蝴蝶结装饰 */
        .bow-left, .bow-right {
            position: absolute;
            font-size: clamp(70px,14vw,110px);
            opacity: 0.85;
            pointer-events: none;
        }
        .bow-left {
            top: 70px;
            left: 8px;
        }
        .bow-right {
            top: 70px;
            right: 8px;
        }
        /* 底部流光蝴蝶装饰 */
        .butterfly-bottom {
            position: absolute;
            bottom: 24px;
            left: 18px;
            font-size: 48px;
            opacity: 0.75;
            pointer-events: none;
        }
        .wave-bottom {
            position: absolute;
            bottom: 0;
            right: 0;
            font-size: 120px;
            opacity:0.65;
            pointer-events: none;
        }
        .container {
            max-width: 440px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        /* 发光头像框 */
        .avatar-wrap {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding:4px;
            background: linear-gradient(135deg,#ffb8e4,#c89dff);
            box-shadow: 0 0 20px #ffb8e4, 0 0 34px #c89dff77;
        }
        .avatar {
            width:100%;
            height:100%;
            border-radius: 50%;
            object-fit: cover;
        }
        /* 花体标题 Morgan */
        .name {
            font-family: 'Segoe Script',cursive;
            font-size: clamp(52px,12vw,78px);
            color: #ffffff;
            text-shadow: 0 0 8px #ffb6e2, 0 0 18px #d8a8ff;
            margin-bottom:42px;
        }
        .link-group {
            display:flex;
            flex-direction: column;
            gap: 22px;
        }
        /* 磨砂玻璃卡片 */
        .link-card a {
            display:flex;
            align-items: center;
            gap:14px;
            background: rgba(255,255,255,0.52);
            backdrop-filter: blur(12px);
            text-decoration: none;
            color:#222;
            padding: 20px 22px;
            border-radius:24px;
            border: 1px solid rgba(255,255,255,0.75);
            box-shadow: 0 4px 16px rgba(180,130,230,0.18);
            transition: 0.25s ease;
        }
        .link-card a:hover {
            background: rgba(255,255,255,0.72);
            transform: translateY(-3px);
        }
        .icon-box {
            width:40px;
            height:40px;
            border-radius:50%;
            background:#d2b0f2;
            display:grid;
            place-items:center;
            color:white;
            font-size:20px;
            flex-shrink:0;
        }
        .card-text {
            font-size: 20px;
            font-weight:500;
        }
    </style>
</head>
<body>
    <!-- 装饰元素 -->
    <div class="bow-left">🎀</div>
    <div class="bow-right">🎀</div>
    <div class="butterfly-bottom">🦋</div>
    <div class="wave-bottom">🪷</div>

    <!-- 星星光点 -->
    <div class="sparkle" style="top:120px;left:12%;font-size:16px;">✦</div>
    <div class="sparkle" style="top:190px;right:14%;font-size:22px;animation-delay:0.4s;">✧</div>
    <div class="sparkle" style="top:320px;left:20%;font-size:14px;animation-delay:0.8s;">✦</div>
    <div class="sparkle" style="bottom:160px;right:10%;font-size:20px;animation-delay:1.2s;">✧</div>
    <div class="sparkle" style="bottom:90px;left:30%;font-size:17px;animation-delay:1.6s;">✦</div>

    <div class="container">
        <!-- 头像 -->
        <div class="avatar-wrap">
            <img class="avatar" src="images/头像.jpg" alt="Morgan">
        </div>
        <div class="name">Morgan</div>

        <div class="link-group">
            <div class="link-card">
                <a href="https://www.instagram.com/morgan.hhh7832?igsh=bHY4N3cwamE2bzZm&utm_source=qr" target="_blank">
                    <div class="icon-box">📷</div>
                    <div class="card-text">我的 Instagram</div>
                </a>
            </div>
            <div class="link-card">
                <a href="#" target="_blank">
                    <div class="icon-box">📝</div>
                    <div class="card-text">我的博客</div>
                </a>
            </div>
            <div class="link-card">
                <a href="images/个人简历1.pdf" target="_blank">
                    <div class="icon-box">📄</div>
                    <div class="card-text">我的简历</div>
                </a>
            </div>
            <div class="link-card">
                <a href="m15390017707@163.com">
                    <div class="icon-box">✉️</div>
                    <div class="card-text">个人邮箱</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
